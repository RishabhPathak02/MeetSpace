<div class="admin-users-container">
  <div class="header">
    <h2>Manage Users</h2>
    <div class="header-actions" style="display: flex; gap: 15px; align-items: center;">
      <select class="role-filter" [ngModel]="roleFilter()" (ngModelChange)="roleFilter.set($event)" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; outline: none; cursor: pointer;">
        <option value="ALL">All</option>
        <option value="ADMIN">Admins Only</option>
        <option value="USER">Users</option>
      </select>
      <button class="btn-primary" (click)="toggleCreateForm()">
        {{ showCreateForm() ? 'Cancel' : '+ Create Admin' }}
      </button>
    </div>
  </div>

  <div *ngIf="error()" class="error-banner">
    {{ error() }}
  </div>

  <!-- Create Admin Form Section -->
  <div class="create-admin-section" *ngIf="showCreateForm()">
    <h3>Register New Administrator</h3>
    <form (ngSubmit)="createAdmin()" class="admin-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="newAdmin.name" name="name" required placeholder="Jane Doe" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="newAdmin.email" name="email" required placeholder="admin@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="newAdmin.password" name="password" required placeholder="Strong password" />
      </div>
      <div class="form-group">
        <label>City</label>
        <select [(ngModel)]="newAdmin.city" name="city" class="city">
        <option value="">Select City</option>
          @for (city of cities(); track city.id) {
              <option [value]="city.name">
                  {{ city.name }}
              </option>
          }
        </select>
      </div>
      <button type="submit" class="btn-success" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating...' : 'Create Admin Account' }}
      </button>
    </form>
  </div>

  <!-- Users Grid -->
  <div class="users-grid" *ngIf="!isLoading()">
    <div class="user-card" *ngFor="let user of filteredUsers()">
      <div class="profile-header">
        
        @if (user.profilePicture) {
          <img 
            [src]="user.profilePicture" 
            alt="Profile Picture" 
            class="avatar"
          />
        } @else {
          <div class="avatar avatar-initials">
            {{ getInitials(user.name) }}
          </div>
        }

        <span class="role-badge" [ngClass]="user.role === 'ADMIN' ? 'badge-admin' : 'badge-user'">
          {{ user.role }}
        </span>
      </div>
      
      <div class="user-details">
        <h3 class="user-name">{{ user.name }}</h3>
        <p class="user-email">{{ user.email }}</p>
        <p class="user-joined">Joined: {{ user.createdAt | date:'mediumDate' }}</p>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading()" class="loading-state">
    <p>Loading users...</p>
  </div>
</div>
