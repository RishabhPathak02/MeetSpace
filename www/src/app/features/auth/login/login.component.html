<div class="auth-shell">
  <!-- Left brand panel -->
  <div class="auth-brand">
    <div class="brand-content">
      <div class="brand-logo">🏢</div>
      <h1 class="brand-heading">MeetSpace</h1>
      <p class="brand-sub">Book. Collaborate. Succeed.</p>
      <div class="brand-features">
        <div class="feature-item"><span class="fi">⚡</span> Instant room booking</div>
        <div class="feature-item"><span class="fi">🔒</span> Secure JWT authentication</div>
        <div class="feature-item"><span class="fi">📅</span> No double-booking guaranteed</div>
        <div class="feature-item"><span class="fi">👑</span> Admin room management</div>
      </div>
    </div>
    <div class="brand-glow"></div>
  </div>

  <!-- Right form panel -->
  <div class="auth-form-panel">
    <app-animated-border>
      <div class="auth-card fade-in" style="background: transparent; border: none; box-shadow: none;">
        <div class="auth-header">
        <h2>Welcome back</h2>
        <p>Sign in to your MeetSpace account</p>
      </div>

      @if (error) {
        <div class="alert alert-error" style="margin-bottom:1rem">⚠️ {{ error }}</div>
      }

      <form (ngSubmit)="onLogin()" #f="ngForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email"
                 placeholder="you@example.com"
                 [(ngModel)]="form.email"
                 (ngModelChange)="error=''"
                 required />
        </div>
        <div class="form-group" style="margin-top:1rem">
          <label class="form-label">Password</label>
          <div class="pass-wrap">
            <input class="form-control" [type]="showPass ? 'text' : 'password'" name="password"
                   placeholder="••••••••"
                   [(ngModel)]="form.password"
                   (ngModelChange)="error=''"
                   required />
            <button type="button" class="pass-toggle" (click)="showPass = !showPass">
              {{ showPass ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <button class="btn btn-primary btn-full btn-lg" type="submit"
                style="margin-top:1.5rem" [disabled]="loading">
          @if (loading) { <span class="spinner" style="width:1rem;height:1rem;border-width:2px"></span> }
          {{ loading ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account?
        <a routerLink="/register">Create one →</a>
      </div>

      <!-- Quick fill admin hint -->
      <div class="quick-fill">
        <span class="qf-label">Quick fill:</span>
        <button class="qf-btn" (click)="fillAdmin()">👑 Admin</button>
      </div>
      </div>
    </app-animated-border>
  </div>
</div>
